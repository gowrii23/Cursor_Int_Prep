name: interview_prep_tracker
description: Principal prep learner — 90-day plan, study content, recall deck, daily focus.
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/checklist.json
    - assets/content/study_content.json
    - assets/content/study_plan.json
    - assets/content/recall_cards.json
